<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Procesos 26-27</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <main class="contenedor">
    <h1>Procesos 26-27</h1>
    <p>Aplicación SaaS con gestión de usuarios.</p>
    <p class="estado">Estado del servidor: <span id="estado-servidor">comprobando…</span></p>
  </main>
  <script>
    // Comprobación mínima de que frontend y API comparten origen.
    fetch('/api/salud')
      .then((r) => r.json())
      .then((d) => { document.getElementById('estado-servidor').textContent = d.estado; })
      .catch(() => { document.getElementById('estado-servidor').textContent = 'sin conexión'; });
  </script>
</body>
</html>
