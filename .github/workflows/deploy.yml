# Despliegue continuo: cada cambio que llega a main se despliega
# automáticamente en Cloud Run. No se despliega a mano.
#
# Configuración necesaria en GitHub (Settings → Secrets and variables → Actions):
#   Secrets:   GCP_SA_KEY         JSON de la cuenta de servicio de despliegue
#   Variables: GCP_PROJECT_ID     id del proyecto de Google Cloud
#              GCP_REGION         p. ej. europe-southwest1 (Madrid)
#              CLOUD_RUN_SERVICE  nombre del servicio, p. ej. procesos2627pr
# Ver docs/despliegue-cloud-run.md
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nunca dos despliegues a la vez; si llega uno nuevo, se cancela el anterior.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: true

jobs:
  desplegar:
    name: Desplegar en Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Construir y desplegar desde el código fuente
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          source: .
          flags: --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            LOG_LEVEL=info

      - name: Mostrar la URL pública
        run: echo "Desplegado en ${{ steps.deploy.outputs.url }}"

      - name: Comprobar que la aplicación responde
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 "${{ steps.deploy.outputs.url }}/api/salud"
